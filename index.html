    <script>
      (function() {
        try {
          var makeMemStorage = function() {
            var store = {};
            return {
              getItem: function(k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
              setItem: function(k, v) { store[k] = String(v); },
              removeItem: function(k) { delete store[k]; },
              clear: function() { store = {}; },
              key: function(i) { return Object.keys(store)[i] || null; },
              get length() { return Object.keys(store).length; }
            };
          };

          var memLocal = makeMemStorage();
          var memSession = makeMemStorage();

          var testStorage = function(storageType) {
            try {
              var s = window[storageType];
              if (!s) return false;
              s.setItem('__test_storage__', '1');
              s.removeItem('__test_storage__');
              return true;
            } catch (e) {
              return false;
            }
          };

          var installSafeStorage = function(storageType, memObj) {
            var targets = [
              typeof window !== 'undefined' ? window : null,
              typeof Window !== 'undefined' ? Window.prototype : null,
              typeof window !== 'undefined' ? Object.getPrototypeOf(window) : null,
              typeof window !== 'undefined' && window.Storage ? window.Storage.prototype : null
            ];
            for (var i = 0; i < targets.length; i++) {
              var t = targets[i];
              if (!t) continue;
              try {
                Object.defineProperty(t, storageType, {
                  get: function() { return memObj; },
                  set: function() {},
                  configurable: true,
                  enumerable: true
                });
              } catch (e) {}
            }
          };

          if (!testStorage('localStorage')) {
            installSafeStorage('localStorage', memLocal);
          }
          if (!testStorage('sessionStorage')) {
            installSafeStorage('sessionStorage', memSession);
          }
        } catch (e) {}

        try {
          var origWarn = console.warn.bind(console);
          var origError = console.error.bind(console);
          var isViteMsg = function(args) {
            return args.some(function(arg) {
              var str = String(arg && arg.message ? arg.message : (arg && arg.stack ? arg.stack : arg || ''));
              return /\[vite\]/i.test(str) || /reading 'send'/i.test(str) || /WebSocket|ws:\/\/|wss:\/\//i.test(str);
            }) || (args.length > 1 && String(args[0]).indexOf('[vite]') !== -1);
          };
          console.warn = function() {
            var args = Array.prototype.slice.call(arguments);
            if (!isViteMsg(args)) origWarn.apply(console, args);
          };
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            if (!isViteMsg(args)) origError.apply(console, args);
          };
        } catch (e) {}
      })();
    </script>
