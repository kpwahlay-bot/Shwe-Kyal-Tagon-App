<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>
  <!-- Golden Hexagon/Star Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" stroke-dasharray="12 8"/>
  <!-- Central Star with Phone/Store Motif -->
  <g filter="url(#glow)">
    <!-- 8-Pointed Star Motif -->
    <path d="M 256 96 L 290 196 L 396 196 L 310 258 L 344 358 L 256 296 L 168 358 L 202 258 L 116 196 L 222 196 Z" fill="url(#goldGrad)" />
    <!-- Center Smartphone Core -->
    <rect x="228" y="212" width="56" height="88" rx="8" fill="#0F172A" stroke="#FEF08A" stroke-width="4"/>
    <circle cx="256" cy="284" r="4" fill="#F59E0B"/>
    <line x1="244" y1="224" x2="268" y2="224" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="424" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#F8FAFC" letter-spacing="3">SKT POS</text>
</svg>
