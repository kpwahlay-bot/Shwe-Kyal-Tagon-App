<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="100%" height="100%">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&amp;family=Noto+Sans+Myanmar:wght@700;800&amp;display=swap');
      .sys2-serif-title {
        font-family: 'Cinzel', 'Times New Roman', 'Georgia', serif;
        font-weight: 900;
        letter-spacing: 1.5px;
      }
      .sys2-myanmar-sub {
        font-family: 'Noto Sans Myanmar', 'Pyidaungsu', 'Padauk', 'Myanmar Text', sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Tech Badge Light Gradient -->
    <linearGradient id="sys2BadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="sys2RibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0038ff" />
    </linearGradient>
  </defs>

  <!-- Oval / Stadium Pill Outer Border in Vivid Royal Blue -->
  <rect
    x="4"
    y="4"
    width="372"
    height="142"
    rx="71"
    fill="#ffffff"
    stroke="#0038ff"
    stroke-width="6"
  />

  <!-- Inner Soft Accent Ring -->
  <rect
    x="8"
    y="8"
    width="364"
    height="134"
    rx="67"
    fill="none"
    stroke="#2563eb"
    stroke-width="1.5"
    stroke-opacity="0.7"
  />

  <!-- TOP ROW: Left Tech S Badge + Right SYSTEM II ® -->
  <g id="top-row">
    <!-- Left: Rounded Square Badge (Light Silver-Blue) -->
    <g transform="translate(56, 20)">
      <rect
        x="0"
        y="0"
        width="58"
        height="58"
        rx="12"
        fill="url(#sys2BadgeGrad)"
        stroke="#2563eb"
        stroke-width="1.5"
      />

      <!-- Top-Right Wing/Arrow extending from S ribbon -->
      <path
        d="M 37 17 L 54 8 L 45 18 Z"
        fill="#0038ff"
      />

      <!-- Stylized S Circuit Ribbon -->
      <!-- Thick Ribbon Path -->
      <path
        d="M 45 16 L 24 16 C 18 16 16 26 23 28 L 35 30 C 42 32 40 42 33 43 L 13 43"
        fill="none"
        stroke="url(#sys2RibbonGrad)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Interior White Circuit Line inside S -->
      <path
        d="M 45 16 L 24 16 C 19 16 18 26 23 28 L 35 30 C 40 32 38 42 33 43 L 13 43"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- PCB Circuit Nodes & Branches -->
      <line x1="20" y1="16" x2="20" y2="10" stroke="#0038ff" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="20" cy="9" r="2" fill="#0038ff" />

      <line x1="38" y1="31" x2="47" y2="31" stroke="#0038ff" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="47" cy="31" r="2" fill="#0038ff" />

      <line x1="24" y1="43" x2="24" y2="49" stroke="#0038ff" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="24" cy="49" r="2" fill="#0038ff" />

      <!-- Precision Tech Gear / Cogwheel in Lower-Right -->
      <g transform="translate(45, 45)">
        <circle cx="0" cy="0" r="4.5" fill="none" stroke="#0038ff" stroke-width="1.8" />
        <circle cx="0" cy="0" r="1.6" fill="#0038ff" />
        <!-- Teeth -->
        <rect x="-0.9" y="-6.8" width="1.8" height="2" fill="#0038ff" rx="0.3" />
        <rect x="-0.9" y="4.8" width="1.8" height="2" fill="#0038ff" rx="0.3" />
        <rect x="-6.8" y="-0.9" width="2" height="1.8" fill="#0038ff" rx="0.3" />
        <rect x="4.8" y="-0.9" width="2" height="1.8" fill="#0038ff" rx="0.3" />
        <rect x="-5" y="-5" width="1.8" height="1.8" fill="#0038ff" rx="0.3" transform="rotate(45)" />
        <rect x="3.2" y="3.2" width="1.8" height="1.8" fill="#0038ff" rx="0.3" transform="rotate(45)" />
        <rect x="-5" y="3.2" width="1.8" height="1.8" fill="#0038ff" rx="0.3" transform="rotate(-45)" />
        <rect x="3.2" y="-5" width="1.8" height="1.8" fill="#0038ff" rx="0.3" transform="rotate(-45)" />
      </g>
    </g>

    <!-- Right: Brand Typography "SYSTEM II" (Serif) + ® -->
    <text
      x="126"
      y="62"
      fill="#002bb8"
      font-size="36"
      class="sys2-serif-title"
    >
      SYSTEM II
    </text>

    <!-- Registered Trademark ® -->
    <g transform="translate(306, 38)">
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#002bb8" stroke-width="1.4" />
      <text
        x="0"
        y="4"
        fill="#002bb8"
        font-size="10"
        font-family="'Times New Roman', 'Cinzel', serif"
        font-weight="bold"
        text-anchor="middle"
      >
        R
      </text>
    </g>
  </g>

  <!-- BOTTOM ROW: Burmese Subtitle "မိုဘိုင်းနှင့် ကွန်ပျူတာ စင်တာ" -->
  <text
    x="190"
    y="119"
    fill="#002bb8"
    font-size="23"
    text-anchor="middle"
    class="sys2-myanmar-sub"
  >
    မိုဘိုင်းနှင့် ကွန်ပျူတာ စင်တာ
  </text>
</svg>
